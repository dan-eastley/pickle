on:
  push:
    branches:
      - 'client-**/release-**/adr-**'

permissions:
  contents: read

jobs:
  do-something-with-the-adr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install CoPilot Extension
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          SUPER_SECRET: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          echo "something >"
          echo "$SUPER_SECRET"
          echo "< something"

          echo "Installing GH CoPilot"
          gh extension install github/gh-copilot

          echo "Authenticating"
          gh auth status
          gh auth login --web -h github.com
#          gh copilot explain "sudo apt-get"