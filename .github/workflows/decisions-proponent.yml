name: Decision Proponent

# Stub. Implementation pending.
# Chains after Principles Alignment via workflow_run.
# Reads the decision JSON, writes a stub to the `proponent` section,
# commits back via GITHUB_TOKEN.

on:
  workflow_run:
    workflows: ["Principles Alignment"]
    types: [completed]

permissions:
  contents: write

jobs:
  proponent:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'decisions/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout decision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write proponent stub to decision JSON
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: "Decision Proponent"
          SECTION_KEY: "proponent"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/decision-stub.sh
