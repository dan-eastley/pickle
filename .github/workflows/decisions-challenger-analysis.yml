name: Challenger Analysis

# Stub. Implementation pending.
# Chains after Proponent Analysis via workflow_run.
# Reads the decision JSON, writes a stub to the `challenger-analysis` section,
# commits back via GITHUB_TOKEN.

on:
  workflow_run:
    workflows: ["Proponent Analysis"]
    types: [completed]

permissions:
  contents: write

jobs:
  challenger:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'decisions/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Started
        run: |
          echo "::notice::Started: Decision Change Challenger"

      - name: Checkout decision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write challenger-analysis stub to decision JSON
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: "Challenger Analysis"
          SECTION_KEY: "challenger-analysis"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/decision-stub.sh

      - name: Finished
        if: always()
        run: |
          echo "::notice::Finished: Decision Change Challenger"
