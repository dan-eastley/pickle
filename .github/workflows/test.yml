name: Tests

# Runs the app test suite for changes OUTSIDE the architectures/ data folder.
# Architecture content changes go through the decisions workflows, not here, so
# they don't trigger (or block on) application tests.
on:
  push:
    paths-ignore:
      - 'architectures/**'
  pull_request:
    paths-ignore:
      - 'architectures/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint

  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm run test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        # The dev server proxies architecture data from GitHub; give it the
        # workflow token. (GITHUB_-prefixed names are exported in-shell rather
        # than via env: to avoid the reserved-prefix restriction.)
        run: |
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GITHUB_OWNER="${{ github.repository_owner }}"
          export GITHUB_REPO="${{ github.event.repository.name }}"
          npm run test:e2e
