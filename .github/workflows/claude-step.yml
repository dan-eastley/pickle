name: Claude Step (Reusable)

# Reusable workflow — runs one Claude-driven step against a record's JSON and
# commits the result back. Shared by:
#   - Decisions workflows — write to decision.json on the decision's branch
#     (the defaults below reproduce this exactly: ref = the decisions branch,
#     record-file = the decision.json path, record-id = decision-id).
#   - Discovery workflow — pass ref=main, record-file=<discovery.json path>,
#     record-id=<DSC-id> to run a prompt against a discovery on main.
#
# The prompt file defines the output format and what to write to `section-key`.
# This step provides the runtime scaffold: checkout, Claude invocation, commit,
# and push (with rebase-retry).

on:
  workflow_call:
    inputs:
      analysis-name:
        description: "Human-readable step name (e.g. Impact Assessment)"
        required: true
        type: string
      prompt-file:
        description: "Path to the prompt markdown file"
        required: true
        type: string
      section-key:
        description: "Record JSON property to write results to (e.g. architecture-changes, findings)"
        required: true
        type: string
      client-id:
        description: "Client ID (e.g. fedc)"
        required: true
        type: string
      version-id:
        description: "Version ID (e.g. 1.0.0)"
        required: true
        type: string
      decision-id:
        description: "Decision ID (e.g. ADR-018). Used as the record id when record-id is not given."
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to check out and push to. Defaults to the decision's branch."
        required: false
        type: string
        default: ""
      record-file:
        description: "Path to the record JSON. Defaults to the decision.json path."
        required: false
        type: string
        default: ""
      record-id:
        description: "Record id for messaging. Defaults to decision-id."
        required: false
        type: string
        default: ""
      model:
        description: "Claude model to run this step with"
        required: false
        type: string
        default: claude-haiku-4-5-20251001
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  run-step:
    runs-on: ubuntu-latest
    env:
      PROMPT_FILE:   ${{ inputs.prompt-file }}
      SECTION_KEY:   ${{ inputs.section-key }}
      ANALYSIS_NAME: ${{ inputs.analysis-name }}
      CLIENT_ID:     ${{ inputs.client-id }}
      VERSION_ID:    ${{ inputs.version-id }}
      REF:           ${{ inputs.ref != '' && inputs.ref || format('decisions/{0}/{1}/{2}', inputs.client-id, inputs.version-id, inputs.decision-id) }}
      RECORD_FILE:   ${{ inputs.record-file != '' && inputs.record-file || format('architectures/clients/{0}/{1}/decisions/{2}/decision.json', inputs.client-id, inputs.version-id, inputs.decision-id) }}
      RECORD_ID:     ${{ inputs.record-id != '' && inputs.record-id || inputs.decision-id }}
    steps:
      - name: Started
        run: |
          echo "::notice::Started: ${ANALYSIS_NAME} (model: ${{ inputs.model }})"

      - name: Verify ANTHROPIC_API_KEY is set
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set or is empty — cannot run Claude step"
            exit 1
          fi
          echo "::notice::ANTHROPIC_API_KEY is present (${#API_KEY} chars)"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude step
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          allowed_tools: "Read,Edit,Write,Grep,Glob"
          prompt: |
            You are running the "${{ env.ANALYSIS_NAME }}" step of a Pickle workflow.

            Record file: ${{ env.RECORD_FILE }}
            Prompt file: ${{ env.PROMPT_FILE }}
            Section key: ${{ env.SECTION_KEY }}

            Steps:
              1. Read the prompt instructions at ${{ env.PROMPT_FILE }}.
              2. Read the record JSON at ${{ env.RECORD_FILE }}.
              3. Read any other inputs the prompt asks for — architecture data
                 lives under architectures/clients/${{ env.CLIENT_ID }}/${{ env.VERSION_ID }}/domains/,
                 schemas under config/schemas/.
              4. Follow the prompt's task exactly, including the output format it specifies.
              5. Write your result into the record JSON's `${{ env.SECTION_KEY }}` property
                 using the Edit or Write tool.

            Do not commit or push — the workflow handles that.

      - name: Report Claude outcome
        if: always()
        run: |
          echo "::notice::Claude conclusion: ${{ steps.claude.outputs.conclusion }}"
          if [ -n "${{ steps.claude.outputs.execution_file }}" ] && [ -f "${{ steps.claude.outputs.execution_file }}" ]; then
            echo "--- Claude execution log (last 100 lines) ---"
            tail -100 "${{ steps.claude.outputs.execution_file }}"
          fi

      - name: Write step summary
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          COUNT=$(python3 -c "
          import json, os, sys
          path = os.environ.get('RECORD_FILE', '')
          key  = os.environ.get('SECTION_KEY', '')
          if not path or not key:
              print('?'); sys.exit()
          try:
              data = json.load(open(path))
              section = data.get(key)
              if section is None:
                  print('0')
              elif isinstance(section, (list, dict)):
                  print(len(section))
              else:
                  print('1')
          except Exception:
              print('?')
          " 2>/dev/null || echo "?")
          ICON="✅"
          [ "$CONCLUSION" != "success" ] && ICON="❌"
          {
            echo "## ${ICON} ${ANALYSIS_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Record | \`${RECORD_ID}\` |"
            echo "| Model | \`${{ inputs.model }}\` |"
            echo "| Section | \`${SECTION_KEY}\` |"
            echo "| Conclusion | \`${CONCLUSION}\` |"
            echo "| Findings | ${COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Claude execution log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claude-${{ inputs.analysis-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30

      - name: Commit and push
        run: |
          set -euo pipefail
          git add "$RECORD_FILE"
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
            exit 0
          fi
          git commit -m "[${ANALYSIS_NAME}] Update ${RECORD_FILE}"
          # The ref can advance out-of-band while this step runs — rebase onto the
          # latest remote head and retry so a concurrent update doesn't fail the
          # push with a non-fast-forward error.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${REF}"; then
              echo "::notice::Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Push rejected (attempt ${attempt}); rebasing onto origin/${REF}."
            git fetch origin "$REF"
            git rebase "origin/${REF}"
          done
          echo "::error::Failed to push ${RECORD_FILE} to ${REF} after rebasing."
          exit 1

      - name: Finished
        if: always()
        run: |
          echo "::notice::Finished: ${ANALYSIS_NAME}"
