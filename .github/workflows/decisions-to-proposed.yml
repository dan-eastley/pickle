name: Decisions — To Proposed

# Fires when a decision moves from DRAFT to PROPOSED.
# Orchestrates the 7 analysis steps sequentially, each writing their findings
# to the decision.json on the decisions branch.
#
# Triggered via workflow_dispatch from the Pickle API on DRAFT → PROPOSED transition.
# Runs sequentially using `needs:` to avoid the 3-hop workflow_run chaining limit.
#
# `model` controls which Claude model all steps run with — defaults to
# Haiku 4.5 to keep dev-time cost down. Override per-dispatch for higher-quality
# runs (e.g. claude-sonnet-4-6).

on:
  workflow_dispatch:
    inputs:
      client-id:
        description: "Client ID (e.g. fedc)"
        required: true
        type: string
      version-id:
        description: "Version ID (e.g. 1.0.0)"
        required: true
        type: string
      decision-id:
        description: "Decision ID (e.g. ADR-018)"
        required: true
        type: string
      model:
        description: "Claude model to run all analysis steps with"
        required: false
        type: string
        default: claude-haiku-4-5-20251001

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        run: |
          {
            echo "## Analysis Pipeline — ${{ inputs.decision-id }}"
            echo ""
            echo "> Moving to **Proposed** submits this decision for AI-driven analysis."
            echo "> The pipeline runs **7 steps sequentially** — each writes its findings to the decision JSON on the decisions branch."
            echo ""
            echo "| # | Step | Section key |"
            echo "|---|---|---|"
            echo "| 1 | Impact Assessment | \`impact-assessment\` |"
            echo "| 2 | Referential Integrity | \`referential-integrity\` |"
            echo "| 3 | Strategy Alignment | \`strategy-alignment\` |"
            echo "| 4 | Principles Alignment | \`principles-alignment\` |"
            echo "| 5 | Guardrails Alignment | \`guardrails-alignment\` |"
            echo "| 6 | Proponent Analysis | \`proponent-analysis\` |"
            echo "| 7 | Challenger Analysis | \`challenger-analysis\` |"
            echo ""
            echo "### Run details"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Decision | \`${{ inputs.decision-id }}\` |"
            echo "| Client / Version | \`${{ inputs.client-id }}\` / \`${{ inputs.version-id }}\` |"
            echo "| Model | \`${{ inputs.model }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  impact-assessment:
    needs: pipeline-summary
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Impact Assessment"
      prompt-file:   config/prompts/decisions/architecture-review.md
      section-key:   impact-assessment
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  referential-integrity:
    needs: impact-assessment
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Referential Integrity"
      prompt-file:   config/prompts/decisions/referential-integrity.md
      section-key:   referential-integrity
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  strategy-alignment:
    needs: referential-integrity
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Strategy Alignment"
      prompt-file:   config/prompts/decisions/strategy-alignment.md
      section-key:   strategy-alignment
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  principles-alignment:
    needs: strategy-alignment
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Principles Alignment"
      prompt-file:   config/prompts/decisions/principles-alignment.md
      section-key:   principles-alignment
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  guardrails-alignment:
    needs: principles-alignment
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Guardrails Alignment"
      prompt-file:   config/prompts/decisions/guardrails-alignment.md
      section-key:   guardrails-alignment
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  proponent-analysis:
    needs: guardrails-alignment
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Proponent Analysis"
      prompt-file:   config/prompts/decisions/proponent-analysis.md
      section-key:   proponent-analysis
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit

  challenger-analysis:
    needs: proponent-analysis
    uses: ./.github/workflows/claude-step.yml
    with:
      analysis-name: "Challenger Analysis"
      prompt-file:   config/prompts/decisions/challenger-analysis.md
      section-key:   challenger-analysis
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
      model:         ${{ inputs.model }}
    secrets: inherit
