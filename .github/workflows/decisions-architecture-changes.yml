name: Decisions — Architecture Changes

# Fires when a decision moves from PROPOSED to ACCEPTED.
# Reads accepted findings, derives discrete architecture changes per artefact,
# and writes them to decision.json on main under 'architecture-changes'.
#
# STUB MODE: synthetic architecture changes are generated without calling Claude.
# Re-enable Claude by replacing the stub step.

on:
  workflow_dispatch:
    inputs:
      client-id:
        required: true
        type: string
      version-id:
        required: true
        type: string
      decision-id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-changes:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID:   ${{ inputs.client-id }}
      VERSION_ID:  ${{ inputs.version-id }}
      DECISION_ID: ${{ inputs.decision-id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── STUB ─────────────────────────────────────────────────────────────────
      - name: Generate architecture changes (stub)
        run: |
          python3 - "$CLIENT_ID" "$VERSION_ID" "$DECISION_ID" <<'PYEOF'
          import sys, json, pathlib

          client_id, version_id, decision_id = sys.argv[1:]
          decision_path = pathlib.Path(
              f"architectures/clients/{client_id}/{version_id}/decisions/{decision_id}/decision.json"
          )

          with open(decision_path) as f:
              decision = json.load(f)

          # Collect accepted findings from all analysis sections
          analysis_keys = [
              "impact-assessment", "referential-integrity", "strategy-alignment",
              "principles-alignment", "guardrails-alignment", "proponent-analysis", "challenger-analysis"
          ]
          accepted_findings = []
          for key in analysis_keys:
              for finding in (decision.get(key) or []):
                  if finding.get("review") == "accepted":
                      accepted_findings.append(finding)

          # STUB: generate synthetic architecture changes
          # In production: send accepted_findings to Claude and parse response
          scope = decision.get("scope", {})
          artefact_id   = scope.get("artefact", "BUS-CAP")
          artefact_name = {
              "BUS-CAP": "Business Capabilities", "BUS-STR": "Business Strategy",
              "DAT-DAC": "Data Domains & Concepts", "APP-DAP": "Application Domains & Platforms",
          }.get(artefact_id, artefact_id)

          changes = [
              {
                  "artefact-id":   artefact_id,
                  "artefact-name": artefact_name,
                  "change-type":   "create",
                  "description":   f"Add new entry to {artefact_name} as identified by accepted findings.",
                  "detail":        "Stub change — replace with Claude-generated output when integration is re-enabled."
              },
              {
                  "artefact-id":   artefact_id,
                  "artefact-name": artefact_name,
                  "change-type":   "update",
                  "description":   f"Update existing entries in {artefact_name} to reflect the decision outcome.",
                  "detail":        "Stub change — replace with Claude-generated output when integration is re-enabled."
              }
          ]

          decision["architecture-changes"] = changes

          with open(decision_path, 'w') as f:
              json.dump(decision, f, indent=4)

          print(f"::notice::Stub generated {len(changes)} architecture changes")
          PYEOF

      - name: Commit to main
        run: |
          DECISION_FILE="architectures/clients/${CLIENT_ID}/${VERSION_ID}/decisions/${DECISION_ID}/decision.json"
          git add "$DECISION_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[Architecture Changes] Update ${DECISION_FILE}"
          git push origin main
