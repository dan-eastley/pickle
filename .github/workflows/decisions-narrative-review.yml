name: Decisions — Narrative Review

# Runs when a decision is first created (DRAFT status).
# Only runs Narrative Review — full analysis pipeline fires on PROPOSED.
# Triggered via workflow_dispatch from the Pickle API when a new decision is saved.

on:
  workflow_dispatch:
    inputs:
      client-id:
        description: "Client ID (e.g. fedc)"
        required: true
        type: string
      version-id:
        description: "Version ID (e.g. 1.0.0)"
        required: true
        type: string
      decision-id:
        description: "Decision ID (e.g. ADR-018)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  narrative-review:
    uses: ./.github/workflows/decisions-analysis-step.yml
    with:
      analysis-name: "Narrative Review"
      prompt-file:   config/prompts/decisions/narrative-validation.md
      section-key:   narrative-validation
      client-id:     ${{ inputs.client-id }}
      version-id:    ${{ inputs.version-id }}
      decision-id:   ${{ inputs.decision-id }}
    secrets: inherit
