name: Decisions Analysis Step

# Reusable workflow — runs one Claude-driven analysis step in the decisions
# pipeline. Invoked once per section by the orchestrator (decisions-pipeline.yml).
# Each call: checks out the decision branch, runs Claude with the supplied
# prompt, writes the four-string {finding, impact, recommendation, rationale}
# array into the supplied section-key of the decision JSON, and pushes the
# updated file back to the branch.

on:
  workflow_call:
    inputs:
      analysis-name:
        description: "Human-readable analysis name (e.g. Architecture Review)"
        required: true
        type: string
      prompt-file:
        description: "Path to the prompt markdown file under config/prompts/decisions/"
        required: true
        type: string
      section-key:
        description: "Decision JSON property to write the result to"
        required: true
        type: string
      branch:
        description: "Decision branch to operate on"
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      PROMPT_FILE: ${{ inputs.prompt-file }}
      SECTION_KEY: ${{ inputs.section-key }}
      ANALYSIS_NAME: ${{ inputs.analysis-name }}
    steps:
      - name: Started
        run: |
          echo "::notice::Started: ${ANALYSIS_NAME}"

      - name: Checkout decision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude analysis
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          allowed_tools: "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            You are running the "${{ inputs.analysis-name }}" step of the architecture decision pipeline.

            Branch:        ${{ env.BRANCH }}
            Prompt file:   ${{ env.PROMPT_FILE }}
            Section key:   ${{ env.SECTION_KEY }}

            Derive the decision file path from the branch name. The branch is
            decisions/<client>/<version>/<decision-id> and the decision JSON
            lives at architectures/clients/<client>/<version>/decisions/<decision-id>/decision.json.

            Steps:
              1. Read the prompt instructions at ${{ env.PROMPT_FILE }}.
              2. Read the decision JSON at the path you derived; the author's
                 narrative is in its `narrative` field.
              3. Read any other inputs the prompt asks for (schemas, catalogues,
                 prior decision-JSON sections).
              4. Follow the prompt's task.
              5. Write your result as a JSON array of four-field objects
                 {finding, impact, recommendation, rationale} into the
                 decision JSON's `${{ env.SECTION_KEY }}` property. Use
                 the Edit or Write tool. Schema is at config/schemas/decision.json.
                 The array may have one element (single finding) or several
                 (distinct findings).

            Do not commit or push — the workflow handles that.

      - name: Commit and push the analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DECISION_FILE_PATH=$(python3 - "$BRANCH" <<'PYEOF_INNER'
          import sys
          parts = sys.argv[1].split('/')
          print(f"architectures/clients/{parts[1]}/{parts[2]}/decisions/{parts[3]}/decision.json")
          PYEOF_INNER
          )
          git add "$DECISION_FILE_PATH"
          if git diff --cached --quiet; then
            echo "::notice::No changes to decision file; nothing to commit."
            exit 0
          fi
          git commit -m "[${ANALYSIS_NAME}] Update ${DECISION_FILE_PATH}"
          git push origin "$BRANCH"

      - name: Finished
        if: always()
        run: |
          echo "::notice::Finished: ${ANALYSIS_NAME}"
