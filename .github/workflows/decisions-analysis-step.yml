name: Decisions Analysis Step

# Reusable workflow — runs one Claude-driven analysis step and writes its
# findings to the decision.json on the decisions branch (in-flight decisions
# live on their branch, not main). Invoked once per section by the
# orchestrator (decisions-analysis.yml) and once by decisions-narrative-review.yml.

on:
  workflow_call:
    inputs:
      analysis-name:
        description: "Human-readable analysis name (e.g. Impact Assessment)"
        required: true
        type: string
      prompt-file:
        description: "Path to the prompt markdown file under config/prompts/decisions/"
        required: true
        type: string
      section-key:
        description: "Decision JSON property to write results to"
        required: true
        type: string
      client-id:
        description: "Client ID (e.g. fedc)"
        required: true
        type: string
      version-id:
        description: "Version ID (e.g. 1.0.0)"
        required: true
        type: string
      decision-id:
        description: "Decision ID (e.g. ADR-018)"
        required: true
        type: string
      model:
        description: "Claude model to run this analysis with"
        required: false
        type: string
        default: claude-haiku-4-5-20251001
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      PROMPT_FILE:   ${{ inputs.prompt-file }}
      SECTION_KEY:   ${{ inputs.section-key }}
      ANALYSIS_NAME: ${{ inputs.analysis-name }}
      CLIENT_ID:     ${{ inputs.client-id }}
      VERSION_ID:    ${{ inputs.version-id }}
      DECISION_ID:   ${{ inputs.decision-id }}
      DECISION_FILE: architectures/clients/${{ inputs.client-id }}/${{ inputs.version-id }}/decisions/${{ inputs.decision-id }}/decision.json
    steps:
      - name: Started
        run: |
          echo "::notice::Started: ${ANALYSIS_NAME} (model: ${{ inputs.model }})"

      - name: Checkout decisions branch
        uses: actions/checkout@v5
        with:
          ref: decisions/${{ inputs.client-id }}/${{ inputs.version-id }}/${{ inputs.decision-id }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude analysis
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          allowed_tools: "Read,Edit,Write,Grep,Glob"
          prompt: |
            You are running the "${{ env.ANALYSIS_NAME }}" step of the Pickle decisions analysis workflow.

            Decision file: ${{ env.DECISION_FILE }}
            Prompt file:   ${{ env.PROMPT_FILE }}
            Section key:   ${{ env.SECTION_KEY }}

            Steps:
              1. Read the prompt instructions at ${{ env.PROMPT_FILE }}.
              2. Read the decision JSON at ${{ env.DECISION_FILE }}; the author's
                 narrative is in its `narrative` field and any requirements are
                 in `requirements`.
              3. Read any other inputs the prompt asks for — architecture data
                 lives under architectures/clients/${{ env.CLIENT_ID }}/${{ env.VERSION_ID }}/domains/,
                 schemas under config/schemas/.
              4. Follow the prompt's task.
              5. Write your result as a JSON array of four-field objects
                 {finding, impact, recommendation, rationale} into the decision
                 JSON's `${{ env.SECTION_KEY }}` property, using the Edit or
                 Write tool. Schema is at config/schemas/decision.json. The
                 array may have one element (single finding) or several
                 (distinct findings).

            Do not commit or push — the workflow handles that.

      - name: Commit and push to decisions branch
        run: |
          set -euo pipefail
          BRANCH="decisions/${CLIENT_ID}/${VERSION_ID}/${DECISION_ID}"
          git add "$DECISION_FILE"
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
            exit 0
          fi
          git commit -m "[${ANALYSIS_NAME}] Update ${DECISION_FILE}"
          git push origin "$BRANCH"

      - name: Finished
        if: always()
        run: |
          echo "::notice::Finished: ${ANALYSIS_NAME}"
