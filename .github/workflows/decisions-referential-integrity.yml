name: Referential Integrity

# Referential Integrity — Claude-driven analysis step in the decision pipeline.
# Chains after "Architecture Review" via workflow_run.
# Loads its prompt from prompts/decisions/referential-integrity.md and writes the
# four-string {finding, impact, recommendation, rationale} result to the
# decision JSON's `referential-integrity` property.

on:
  workflow_run:
    workflows: ["Architecture Review"]
    types: [completed]

permissions:
  contents: write

jobs:
  referential-integrity:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'decisions/') }}
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PROMPT_FILE: prompts/decisions/referential-integrity.md
      SECTION_KEY: referential-integrity
    steps:
      - name: Started
        run: |
          echo "::notice::Started: Referential Integrity"

      - name: Checkout decision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude analysis
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            You are running the "Referential Integrity" step of the architecture decision pipeline.

            Branch:        ${{ env.BRANCH }}
            Prompt file:   ${{ env.PROMPT_FILE }}
            Section key:   ${{ env.SECTION_KEY }}

            Derive the decision file path from the branch name. The branch is
            decisions/<client>/<version>/<decision-id> and the decision JSON
            lives at architectures/<client>/<version>/decisions/<decision-id>.json.

            Steps:
              1. Read the prompt instructions at ${{ env.PROMPT_FILE }}.
              2. Read the decision JSON at the path you derived; the author's
                 narrative is in its `narrative` field.
              3. Read any other inputs the prompt asks for (schemas, catalogues,
                 prior decision-JSON sections).
              4. Follow the prompt's task.
              5. Write your result as a four-field object {finding, impact,
                 recommendation, rationale} into the decision JSON's
                 `${{ env.SECTION_KEY }}` property. Use the Edit or Write
                 tool. Schema is at schemas/decision.json.

            Do not commit or push — the workflow handles that.

      - name: Commit and push the analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DECISION_FILE_PATH=$(python3 - "$BRANCH" <<'PYEOF_INNER'
          import sys
          parts = sys.argv[1].split('/')
          print(f"architectures/{parts[1]}/{parts[2]}/decisions/{parts[3]}.json")
          PYEOF_INNER
          )
          git add "$DECISION_FILE_PATH"
          if git diff --cached --quiet; then
            echo "::notice::No changes to decision file; nothing to commit."
            exit 0
          fi
          git commit -m "[Referential Integrity] Update ${DECISION_FILE_PATH}"
          git push origin "$BRANCH"

      - name: Finished
        if: always()
        run: |
          echo "::notice::Finished: Referential Integrity"
